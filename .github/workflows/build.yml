name: Build StudyPal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "av<19"
        pip install pyinstaller
    
    - name: Download Piper binary
      run: |
        Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile piper.zip
        Expand-Archive piper.zip -DestinationPath piper_extracted
        $dst = "$env:LOCALAPPDATA\Programs\piper"
        New-Item -ItemType Directory -Path $dst -Force | Out-Null
        if (Test-Path "piper_extracted\piper\piper.exe") {
          Copy-Item "piper_extracted\piper\*" $dst -Recurse -Force
        } else {
          Copy-Item "piper_extracted\*" $dst -Recurse -Force
        }
    
    - name: Download Piper voices
      run: |
        $voiceDir = "$env:LOCALAPPDATA\piper"
        New-Item -ItemType Directory -Path $voiceDir -Force | Out-Null
        $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main"
        $voices = @(
          "en/en_US/lessac/medium/en_US-lessac-medium.onnx",
          "en/en_US/lessac/medium/en_US-lessac-medium.onnx.json",
          "en/en_US/ryan/medium/en_US-ryan-medium.onnx",
          "en/en_US/ryan/medium/en_US-ryan-medium.onnx.json",
          "en/en_US/amy/low/en_US-amy-low.onnx",
          "en/en_US/amy/low/en_US-amy-low.onnx.json",
          "en/en_US/lessac/low/en_US-lessac-low.onnx",
          "en/en_US/lessac/low/en_US-lessac-low.onnx.json",
          "sw/sw_CD/lanfrica/medium/sw_CD-lanfrica-medium.onnx",
          "sw/sw_CD/lanfrica/medium/sw_CD-lanfrica-medium.onnx.json"
        )
        foreach ($v in $voices) {
          $name = Split-Path $v -Leaf
          Invoke-WebRequest -Uri "$base/$v" -OutFile "$voiceDir\$name"
        }
    
    - name: Install Argos Translate
      run: pip install argostranslate
    
    - name: Download Argos models
      run: python -m argostranslate.package update && python -c "import argostranslate.package; argostranslate.package.install_from_path(next(p for p in argostranslate.package.get_available_packages() if p.from_code=='sw' and p.to_code=='en').download()) && python -c "import argostranslate.package; argostranslate.package.install_from_path(next(p for p in argostranslate.package.get_available_packages() if p.from_code=='en' and p.to_code=='sw').download())"
    
    - name: Build with PyInstaller
      run: pyinstaller studypal.spec --clean
    
    - name: Zip the build
      run: Compress-Archive -Path dist\StudyPal\* -DestinationPath StudyPal-Windows.zip
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudyPal-Windows
        path: StudyPal-Windows.zip
        retention-days: 30
    
    - name: Upload to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: StudyPal-Windows.zip
        generate_release_notes: true
