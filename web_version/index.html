<!DOCTYPE html>
<html>
<head>
    <title>StudyPal Web</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0ff;
            min-height: 100vh;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 12px;
            font-size: 16px;
            background: #0f3460;
            color: #e0e0ff;
            border: 1px solid #2a2a4e;
            border-radius: 8px;
            resize: vertical;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        button {
            padding: 10px 24px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .play { background: #4CAF50; color: white; }
        .pause { background: #FF9800; color: white; }
        .stop { background: #f44336; color: white; }
        .open { background: #6C63FF; color: white; }
        .uploading { background: #FF9800; color: white; }
        .controls { margin: 10px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        input[type="range"] { width: 150px; }
        .status { margin: 10px 0; padding: 10px; background: #16213e; border-radius: 4px; }
        .voice-select { padding: 8px; border-radius: 4px; background: #16213e; color: #e0e0ff; border: 1px solid #2a2a4e; min-width: 200px; }
        .file-info { color: #8899bb; font-size: 14px; margin-left: 10px; }
        .error { color: #f44336; }
        .success { color: #4CAF50; }
        .loading { color: #FF9800; }
        .hint { color: #8899bb; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>📚 StudyPal Web</h1>
    
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
        <button class="open" onclick="openFile()">📂 Open</button>
        <input type="file" id="fileInput" accept=".txt,.pdf,.docx" style="display:none" onchange="uploadFile(event)">
        <span id="fileInfo" class="file-info">No file loaded</span>
        <span id="uploadStatus"></span>
    </div>
    
    <div class="controls">
        <button class="play" id="playBtn" onclick="playText()">▶ Play</button>
        <button class="pause" onclick="pauseText()">⏸ Pause</button>
        <button class="stop" onclick="stopText()">⏹ Stop</button>
        
        <span style="margin-left:15px;">Speed:</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
        <span id="speedLabel">1.0x</span>
        
        <span style="margin-left:15px;">Voice:</span>
        <select class="voice-select" id="voiceSelect">
            <option value="">Loading voices...</option>
        </select>
    </div>
    
    <div>
        <textarea id="textDisplay" placeholder="Upload a document or paste text here..."></textarea>
    </div>
    
    <div class="status" id="status">Ready</div>
    <div class="hint">💡 Tip: Use Google Chrome for best voice support. Press Space to play/pause.</div>
    
    <script>
        let utterance = null;
        let isPlaying = false;
        let isPaused = false;
        let voicesLoaded = false;
        let currentChunks = [];
        let chunkIndex = 0;
        
        // Load available voices
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const select = document.getElementById('voiceSelect');
            
            if (!voices || voices.length === 0) {
                select.innerHTML = '<option value="">⚠️ No voices found</option>';
                document.getElementById('status').textContent = '⚠️ No voices available. Try Google Chrome.';
                return;
            }
            
            voicesLoaded = true;
            select.innerHTML = '';
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.value = i;
                let label = voice.name;
                if (voice.lang) label += ' (' + voice.lang + ')';
                if (voice.default) label += ' ★';
                option.text = label;
                select.appendChild(option);
            });
            document.getElementById('status').textContent = '✅ ' + voices.length + ' voices loaded';
        }
        
        // Try multiple times to load voices
        loadVoices();
        setTimeout(loadVoices, 500);
        setTimeout(loadVoices, 1000);
        setTimeout(loadVoices, 2000);
        
        // Chrome needs user interaction
        document.addEventListener('click', function() {
            if (!voicesLoaded) {
                loadVoices();
            }
        });
        document.addEventListener('keydown', function() {
            if (!voicesLoaded) {
                loadVoices();
            }
        });
        
        speechSynthesis.onvoiceschanged = loadVoices;
        
        function openFile() {
            document.getElementById('fileInput').click();
        }
        
        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const status = document.getElementById('uploadStatus');
            const fileInfo = document.getElementById('fileInfo');
            
            if (file.size > 10 * 1024 * 1024) {
                status.innerHTML = '❌ File too large (max 10MB)';
                status.className = 'error';
                return;
            }
            
            status.innerHTML = '⏳ Uploading...';
            status.className = 'loading';
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.error) {
                    status.innerHTML = '❌ ' + result.error;
                    status.className = 'error';
                    return;
                }
                
                document.getElementById('textDisplay').value = result.text;
                fileInfo.textContent = '📄 ' + result.filename;
                status.innerHTML = '✅ Loaded';
                status.className = 'success';
                document.getElementById('status').textContent = 'Loaded: ' + result.filename;
                
            } catch (error) {
                status.innerHTML = '❌ ' + error.message;
                status.className = 'error';
            }
        }
        
        function playText() {
            const text = document.getElementById('textDisplay').value;
            if (!text || text.trim() === '') {
                document.getElementById('status').textContent = 'Please enter or upload text first.';
                return;
            }
            
            const voices = speechSynthesis.getVoices();
            if (!voices || voices.length === 0) {
                document.getElementById('status').textContent = '⚠️ No voices available. Please use Google Chrome.';
                return;
            }
            
            if (isPaused && utterance) {
                speechSynthesis.resume();
                isPaused = false;
                isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸ Pause';
                document.getElementById('status').textContent = 'Playing...';
                return;
            }
            
            if (isPlaying) {
                pauseText();
                return;
            }
            
            stopText();
            
            const voiceIndex = document.getElementById('voiceSelect').value;
            const speed = parseFloat(document.getElementById('speedSlider').value);
            
            // Split into sentences
            currentChunks = text.match(/[^.!?]+[.!?]+/g) || [text];
            currentChunks = currentChunks.map(c => c.trim()).filter(c => c.length > 0);
            chunkIndex = 0;
            
            if (currentChunks.length === 0) {
                document.getElementById('status').textContent = 'No text to read.';
                return;
            }
            
            isPlaying = true;
            isPaused = false;
            document.getElementById('playBtn').textContent = '⏸ Pause';
            document.getElementById('status').textContent = 'Playing... 0/' + currentChunks.length;
            
            speakNextChunk(voiceIndex, speed);
        }
        
        function speakNextChunk(voiceIndex, speed) {
            if (!isPlaying || chunkIndex >= currentChunks.length) {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ Play';
                document.getElementById('status').textContent = '✅ Finished';
                return;
            }
            
            const chunk = currentChunks[chunkIndex];
            if (!chunk) {
                chunkIndex++;
                speakNextChunk(voiceIndex, speed);
                return;
            }
            
            const voices = speechSynthesis.getVoices();
            utterance = new SpeechSynthesisUtterance(chunk);
            if (voices[voiceIndex]) {
                utterance.voice = voices[voiceIndex];
            }
            utterance.rate = speed;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            utterance.onstart = function() {
                document.getElementById('status').textContent = 'Playing... ' + (chunkIndex+1) + '/' + currentChunks.length;
            };
            
            utterance.onend = function() {
                chunkIndex++;
                speakNextChunk(voiceIndex, speed);
            };
            
            utterance.onerror = function(e) {
                if (e.error === 'canceled') {
                    return;
                }
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ Play';
                document.getElementById('status').textContent = '❌ Error: ' + e.error;
            };
            
            speechSynthesis.speak(utterance);
        }
        
        function pauseText() {
            if (isPlaying && !isPaused) {
                speechSynthesis.pause();
                isPaused = true;
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ Resume';
                document.getElementById('status').textContent = '⏸ Paused';
            }
        }
        
        function stopText() {
            speechSynthesis.cancel();
            isPlaying = false;
            isPaused = false;
            chunkIndex = 0;
            document.getElementById('playBtn').textContent = '▶ Play';
            document.getElementById('status').textContent = '⏹ Stopped';
        }
        
        // Speed slider
        document.getElementById('speedSlider').addEventListener('input', function() {
            document.getElementById('speedLabel').textContent = this.value + 'x';
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                playText();
            }
            if (e.key === 'Escape') {
                stopText();
            }
        });
        
        // Ctrl+O to open
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
                e.preventDefault();
                openFile();
            }
        });
    </script>
</body>
</html>
