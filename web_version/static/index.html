<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StudyPal</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>StudyPal</h1>
  <span id="status" class="status"></span>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="listen">Listen</button>
  <button class="tab" data-tab="read">Read</button>
</nav>

<section id="tab-listen" class="panel active">

  <div class="card">
    <label class="btn primary big" for="audioFile">Upload Audio</label>
    <input type="file" id="audioFile" accept="audio/*" hidden>
    <button id="recordBtn" class="btn danger big">Record</button>
    <span id="audioInfo" class="hint">No audio loaded</span>
  </div>

  <div class="card" id="transcriptCard" hidden>
    <h3>Transcript</h3>
    <textarea id="transcript" rows="6" placeholder="Transcription will appear here..."></textarea>

    <div class="row">
      <select id="targetLang">
        <option value="">Translate to...</option>
        <option value="sw">Swahili</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="pt">Portuguese</option>
        <option value="ar">Arabic</option>
        <option value="zh">Chinese</option>
        <option value="hi">Hindi</option>
      </select>
      <button id="translateBtn" class="btn">Translate</button>
    </div>

    <div id="translationWrap" hidden>
      <h3>Translation</h3>
      <textarea id="translation" rows="4"></textarea>
    </div>

    <div class="row wrap">
      <button class="btn" onclick="copyText('transcript')">Copy</button>
      <button class="btn" onclick="saveAsTxt()">TXT</button>
      <button class="btn" onclick="saveAsSrt()">SRT</button>
      <button class="btn success" onclick="readAloud('transcript')">Read Aloud</button>
      <button class="btn success" onclick="readAloud('translation')">Read Translation</button>
      <button class="btn primary" onclick="saveAudioFromText()">Save Audio</button>
    </div>
  </div>
</section>

<section id="tab-read" class="panel">

  <div class="card">
    <label class="btn primary big" for="docFile">Open Document</label>
    <input type="file" id="docFile" accept=".txt,.pdf,.docx" hidden>
    <button class="btn" onclick="pasteMode()">Paste Text</button>
    <span id="docInfo" class="hint">No document loaded</span>
  </div>

  <div class="card">
    <textarea id="docText" rows="10" placeholder="Paste or open a document..."></textarea>
  </div>

  <div class="card">
    <div class="row wrap">
      <button id="playBtn" class="btn success big" onclick="playText()">Play</button>
      <button id="pauseBtn" class="btn warn big" onclick="pauseText()" disabled>Pause</button>
      <button id="stopBtn" class="btn danger big" onclick="stopText()" disabled>Stop</button>
      <button id="saveAudioBtn" class="btn primary big" onclick="saveAudioFromText()" disabled>Save Audio</button>
    </div>

    <div class="row">
      <label>Speed: <span id="speedLabel">1.0x</span></label>
      <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="row">
      <label for="voiceSelect">Voice:</label>
      <select id="voiceSelect" class="grow"></select>
    </div>
  </div>
</section>

<audio id="player" preload="auto"></audio>

<script src="/app.js"></script>
</body>
</html>
